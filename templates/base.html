<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FairFight Technologies{% endblock %}</title>

    <meta
        name="description"
        content="FairFight Technologies builds intelligent accessibility solutions."
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header class="navbar">

        <div class="container nav-container">

            <a href="{{ url_for('home') }}" class="logo">
               <img
                     src="{{ url_for('static', filename='images/fairfight-logo.png') }}"
                     alt="FairFight Technologies"
    >
            </a>

            <nav class="nav-links">

                <a href="{{ url_for('home') }}">Home</a>

                <a href="{{ url_for('joymouse') }}">JoyMouse</a>

                <a href="{{ url_for('technology') }}">Technology</a>

                <a href="{{ url_for('impact') }}">Impact</a>

                <a href="{{ url_for('about') }}">About</a>

                <a href="{{ url_for('contact') }}" class="nav-cta">
                    Contact
                </a>

            </nav>

            <button class="menu-button" onclick="toggleMenu()">
                ☰
            </button>

        </div>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <div class="container footer-container">

            <div>
                <h3>FairFight Technologies</h3>

                <p>
                    Building technology that removes barriers
                    between people and the digital world.
                </p>
            </div>

            <div>
                <h4>Products</h4>

                <a href="{{ url_for('joymouse') }}">
                    JoyMouse
                </a>
            </div>

            <div>
                <h4>Company</h4>

                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('impact') }}">Impact</a>
                <a href="{{ url_for('contact') }}">Contact</a>
            </div>

        </div>

        <div class="footer-bottom">
            © 2026 FairFight Technologies. All rights reserved.
        </div>

    </footer>


    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
